<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nathaniel Planet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0a0420; --card:#1b1040e6; --edge:#7b5cff; --txt:#f4f0ff; --dim:#b9aee8; --accent:#ffd84d;
    --font:'Fredoka','Comic Sans MS','Chalkboard SE',ui-rounded,system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#000005;overflow:hidden;font-family:var(--font);color:var(--txt)}
  canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #title{position:fixed;left:20px;top:16px;pointer-events:none}
  #title h1{margin:0;font-size:clamp(22px,4vw,36px);font-weight:600;letter-spacing:.5px;
    text-shadow:0 3px 0 #3b1fa3,0 0 18px #6a8cff99}
  #title p{margin:2px 0 0;color:var(--dim);font-size:14px}
  .label{position:fixed;left:0;top:0;pointer-events:auto;cursor:pointer;white-space:nowrap;
    font-size:13px;font-weight:600;padding:2px 9px 3px;border-radius:999px;color:#2a1450;
    background:#fff8d6;border:2px solid #2a1450;box-shadow:0 2px 0 #2a1450;transform:translate(-50%,-135%);
    opacity:0;transition:opacity .2s;will-change:transform}
  .label.volcano{background:#ff8a3d;color:#3a0d00;border-color:#3a0d00;box-shadow:0 2px 0 #3a0d00;font-size:15px}
  .label.storm{background:#d8e9ff;color:#122a5c;border-color:#122a5c;box-shadow:0 2px 0 #122a5c}
  .label:hover{background:var(--accent)}
  .label.boat{background:#fff;color:#12306a;border-color:#12306a;box-shadow:0 2px 0 #12306a;font-size:14px;pointer-events:none}
  #card .meta{color:var(--dim);font-size:13px}
  #card p b{color:var(--accent);font-weight:600}
  #card i{display:block;margin-top:6px;color:#e9e3ff}
  #card{z-index:20;position:fixed;left:50%;bottom:64px;transform:translate(-50%,20px);width:min(440px,calc(100% - 32px));
    background:var(--card);border:2px solid var(--edge);border-radius:18px;padding:14px 18px 14px;
    backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:.25s}
  #card.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
  #card h2{margin:0 0 4px;font-size:20px;color:var(--accent)}
  #card p{margin:0;font-size:15px;line-height:1.35}
  #card button{position:absolute;right:10px;top:8px;background:none;border:0;color:var(--dim);font:inherit;font-size:20px;cursor:pointer}
  #bar{position:fixed;right:14px;top:14px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  .btn{font:inherit;font-size:14px;color:var(--txt);background:#1b1040cc;border:2px solid var(--edge);
    border-radius:999px;padding:7px 14px;cursor:pointer;backdrop-filter:blur(4px)}
  .btn:hover,.btn.on{background:#3b1fa3}
  #places{position:fixed;right:14px;top:62px;width:210px;max-height:calc(100% - 140px);overflow:auto;
    background:var(--card);border:2px solid var(--edge);border-radius:16px;padding:8px;display:none}
  #places.on{display:block}
  #places button{display:block;width:100%;text-align:left;font:inherit;font-size:14px;color:var(--txt);
    background:none;border:0;border-radius:10px;padding:7px 10px;cursor:pointer}
  #places button:hover{background:#3b1fa3}
  #places .sec{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);padding:6px 10px 2px}
  #hint{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);color:var(--dim);font-size:13px;pointer-events:none;
    text-align:center;white-space:nowrap}
  #loading{position:fixed;inset:0;display:grid;place-items:center;background:#000005;font-size:22px;z-index:9;transition:opacity .6s}
  body.pointer canvas#c{cursor:pointer}
  @media(max-width:560px){#hint{white-space:normal;width:90%}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title"><h1>Nathaniel Planet</h1><p>Anton's vision of another world</p></div>
<div id="bar">
  <button class="btn on" id="spin">Spinning</button>
  <button class="btn" id="placesBtn">Places</button>
</div>
<div id="places"></div>
<div id="card"><button id="cardX" aria-label="close">×</button><h2></h2><p></p></div>
<div id="hint">drag to spin · scroll or pinch to zoom · click cities, boats, the volcano and the storm</div>
<div id="loading">Making a planet…</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="planet-gen.js"></script>
<script>
(function () {
'use strict';
const T = THREE;
const SEED = 101;

/* ---------- content ---------- */
const CITY_INFO = [
  ['Nate Zealand', 'Famous for sheep that knit their own sweaters.'],
  ['Noranta', 'Its streets get repainted a different colour every Tuesday.'],
  ['Nephatal', 'Home of the tallest sandcastle in the world. It has stood for 400 years.'],
  ['Nimbleton', 'Everyone here walks on tiptoe, just in case.'],
  ['Snorfen', 'A very sleepy town. The mayor naps through every speech.'],
  ['Gnarlyburg', 'Built inside one enormous, twisty tree.'],
  ['Tanglenook', 'Nobody has ever found the way out. Nobody minds.'],
  ['Quonkle', 'Population: 12 people and 4,000 frogs.'],
  ['Nubbin Bay', 'The seagulls here play the bagpipes. Badly, and proudly.'],
  ['Wibblenon', 'A wobbly city that sways gently in the breeze.'],
];

/* ---------- renderer / scene ---------- */
const canvas = document.getElementById('c');
const renderer = new T.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0x000005);
const scene = new T.Scene();
const camera = new T.PerspectiveCamera(42, 1, 0.05, 400);
camera.position.set(0.9, 0.7, 3.3);
scene.add(camera);

const sun = new T.DirectionalLight(0xffffff, 0.62);
sun.position.set(-2, 2.2, 3);
camera.add(sun);
scene.add(new T.AmbientLight(0xffffff, 0.66));

const controls = new T.OrbitControls(camera, canvas);
controls.enablePan = false;
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.minDistance = 1.5;
controls.maxDistance = 6;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.6;

const planetGroup = new T.Group();
scene.add(planetGroup);

const toonGrad = (() => {
  const d = new Uint8Array([110, 190, 255]);
  const t = new T.DataTexture(d, 3, 1, T.LuminanceFormat);
  t.minFilter = t.magFilter = T.NearestFilter; t.needsUpdate = true; return t;
})();
const toon = (color, extra) => new T.MeshToonMaterial(Object.assign({ color, gradientMap: toonGrad }, extra || {}));
const inkMat = new T.MeshBasicMaterial({ color: 0x120a2a, side: T.BackSide });
function withInk(mesh, s) { const o = new T.Mesh(mesh.geometry, inkMat); o.scale.setScalar(s || 1.12); mesh.add(o); return mesh; }

const UP = new T.Vector3(0, 1, 0);
function placeOnSurface(obj, n, radius, spin) {
  obj.position.copy(n).multiplyScalar(radius || 1);
  obj.quaternion.setFromUnitVectors(UP, n);
  if (spin) obj.rotateY(spin);
}
const v3 = a => new T.Vector3(a[0], a[1], a[2]);
const angle = (a, b) => Math.acos(Math.min(1, Math.max(-1, a.dot(b))));

/* ---------- stars ---------- */
let starMat = null;
(function () {
  const n = 3600, pos = new Float32Array(n * 3), col = new Float32Array(n * 3),
        size = new Float32Array(n), phase = new Float32Array(n);
  const rng = PlanetGen.mulberry32(5);
  const tints = [[1, 1, 1], [1, .93, .75], [.75, .85, 1], [1, .8, .85]];
  for (let i = 0; i < n; i++) {
    const z = rng() * 2 - 1, t = rng() * 6.2832, r = Math.sqrt(1 - z * z), R = 120;
    pos.set([R * r * Math.cos(t), R * z, R * r * Math.sin(t)], i * 3);
    col.set(tints[Math.floor(rng() * tints.length)], i * 3);
    size[i] = rng() < 0.07 ? 6 + rng() * 5 : 1.8 + rng() * 2.6;
    phase[i] = rng() * 6.28;
  }
  const g = new T.BufferGeometry();
  g.setAttribute('position', new T.BufferAttribute(pos, 3));
  g.setAttribute('color', new T.BufferAttribute(col, 3));
  g.setAttribute('size', new T.BufferAttribute(size, 1));
  g.setAttribute('phase', new T.BufferAttribute(phase, 1));
  const m = new T.ShaderMaterial({
    uniforms: { time: { value: 0 }, pr: { value: renderer.getPixelRatio() } },
    vertexShader: `attribute float size; attribute float phase; attribute vec3 color; uniform float time; uniform float pr;
      varying vec3 vC; varying float vT;
      void main(){ vC=color; vT=0.65+0.35*sin(time*1.4+phase);
        gl_PointSize=size*pr*(0.8+0.2*vT); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);} `,
    fragmentShader: `varying vec3 vC; varying float vT;
      void main(){ float d=length(gl_PointCoord-0.5); float a=smoothstep(0.5,0.1,d)*vT; gl_FragColor=vec4(vC,a);} `,
    transparent: true, depthWrite: false,
  });
  const pts = new T.Points(g, m); pts.frustumCulled = false; scene.add(pts);
  starMat = m;
})();

/* ---------- build the world (after first paint) ---------- */
let world = null;
const pickables = [];
const labels = [];
const tickers = [];   // functions(t, dt)

function build() {
  const P = PlanetGen.createPlanet(SEED);
  const rng = PlanetGen.mulberry32(77);

  /* planet surface */
  const tex = P.buildTexture(2048, 1024);
  const cv = document.createElement('canvas'); cv.width = tex.width; cv.height = tex.height;
  const ctx = cv.getContext('2d');
  ctx.putImageData(new ImageData(tex.data, tex.width, tex.height), 0, 0);
  const map = new T.CanvasTexture(cv);
  map.anisotropy = renderer.capabilities.getMaxAnisotropy();
  const planet = new T.Mesh(new T.SphereGeometry(1, 128, 96), new T.MeshLambertMaterial({ map }));
  planetGroup.add(planet);

  /* atmosphere: banded cartoon glow outside + soft rim inside */
  const atmoOut = new T.Mesh(new T.SphereGeometry(1.14, 64, 48), new T.ShaderMaterial({
    side: T.BackSide, transparent: true, depthWrite: false, blending: T.AdditiveBlending,
    vertexShader: `varying vec3 vN; void main(){ vN=normalize(normalMatrix*normal); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);} `,
    fragmentShader: `varying vec3 vN; void main(){ float i=pow(max(0.0,0.72-dot(vN,vec3(0,0,1))),3.0)*2.6; i=floor(i*5.0+0.5)/5.0; gl_FragColor=vec4(vec3(0.25,0.55,1.0)*i,i);} `,
  }));
  scene.add(atmoOut);
  const atmoIn = new T.Mesh(new T.SphereGeometry(1.025, 64, 48), new T.ShaderMaterial({
    transparent: true, depthWrite: false, blending: T.AdditiveBlending,
    vertexShader: `varying vec3 vN; void main(){ vN=normalize(normalMatrix*normal); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);} `,
    fragmentShader: `varying vec3 vN; void main(){ float i=pow(1.0-max(0.0,dot(vN,vec3(0,0,1))),2.6); i=floor(i*4.0)/4.0*0.65; gl_FragColor=vec4(vec3(0.3,0.6,1.0)*i,i);} `,
  }));
  scene.add(atmoIn);

  /* helpers to find places */
  const nearLand = (d, r) => {
    const t = [0, 0, 0];
    const a = v3(d), u = new T.Vector3().crossVectors(a, Math.abs(a.y) > 0.9 ? new T.Vector3(1, 0, 0) : UP).normalize();
    const w = new T.Vector3().crossVectors(a, u);
    for (let k = 0; k < 8; k++) {
      const th = k / 8 * 6.2832;
      const q = a.clone().addScaledVector(u, Math.cos(th) * r).addScaledVector(w, Math.sin(th) * r).normalize();
      if (!P.isLand([q.x, q.y, q.z])) return false;
    }
    return true;
  };
  const allOcean = (d, r) => {
    const a = v3(d), u = new T.Vector3().crossVectors(a, UP).normalize(), w = new T.Vector3().crossVectors(a, u);
    for (const rr of [r * 0.5, r]) for (let k = 0; k < 10; k++) {
      const th = k / 10 * 6.2832;
      const q = a.clone().addScaledVector(u, Math.cos(th) * rr).addScaledVector(w, Math.sin(th) * rr).normalize();
      if (P.isLand([q.x, q.y, q.z])) return false;
    }
    return !P.isLand(d);
  };

  // candidate land points
  const cand = [];
  for (let i = 0; i < 9000 && cand.length < 1800; i++) {
    const d = P.randomDir(rng);
    if (P.isLand(d) && nearLand(d, 0.035)) cand.push({ d, n: v3(d), h: P.relHeight(d), b: P.biome(d) });
  }

  /* Mount Fugi: highest green hill, preferably mid-latitude */
  let fugi = null;
  for (const c of cand) {
    if (c.b !== 'green' || Math.abs(c.d[1]) > 0.7 || Math.abs(c.d[1]) < 0.4) continue;
    if (!nearLand(c.d, 0.12)) continue;
    if (!fugi || c.h > fugi.h) fugi = c;
  }
  fugi = fugi || cand.filter(c => c.b === 'green').sort((a, b) => b.h - a.h)[0] || cand[0];

  /* cities: farthest-point spread across all land */
  const taken = [fugi.n];
  const cities = [];
  for (let i = 0; i < CITY_INFO.length; i++) {
    let best = null, bd = -1;
    for (const c of cand) {
      let m = 9; for (const t of taken) m = Math.min(m, angle(c.n, t));
      if (m > bd) { bd = m; best = c; }
    }
    taken.push(best.n);
    cities.push({ name: CITY_INFO[i][0], info: CITY_INFO[i][1], n: best.n, biome: best.b });
  }

  /* mountains */
  const mtnN = [];
  const mtnGroup = new T.Group(); planetGroup.add(mtnGroup);
  const mtnGeo = new T.ConeGeometry(0.03, 0.055, 6); mtnGeo.translate(0, 0.0275, 0);
  const capGeo = new T.ConeGeometry(0.0135, 0.026, 6); capGeo.translate(0, 0.042, 0);
  const rockCols = [0x9a8c9e, 0x8a7f96, 0xa59a8a];
  const sortedCand = cand.filter(c => c.h > 0.4).sort(() => rng() - 0.5);
  for (const c of sortedCand) {
    if (mtnN.length >= 55) break;
    if (angle(c.n, fugi.n) < 0.3) continue;
    if (cities.some(k => angle(c.n, k.n) < 0.11)) continue;
    if (mtnN.some(m => angle(c.n, m) < 0.09)) continue;
    mtnN.push(c.n);
    const cluster = 1 + Math.floor(rng() * 3);
    const u = new T.Vector3().crossVectors(c.n, UP).normalize(), w = new T.Vector3().crossVectors(c.n, u);
    for (let k = 0; k < cluster; k++) {
      const g = new T.Group();
      const s = 0.65 + rng() * 0.9;
      const body = withInk(new T.Mesh(mtnGeo, toon(rockCols[Math.floor(rng() * 3)])), 1.14);
      const cap = new T.Mesh(capGeo, toon(0xffffff));
      g.add(body, cap); g.scale.setScalar(s);
      const p = c.n.clone().addScaledVector(u, (rng() - .5) * 0.05).addScaledVector(w, (rng() - .5) * 0.05).normalize();
      placeOnSurface(g, p, 0.995, rng() * 6);
      mtnGroup.add(g);
    }
  }

  /* cities */
  const houseCols = [0xff6b6b, 0xffd23f, 0x4ecdc4, 0xff9ff3, 0x9b7bff, 0xff9f43];
  cities.forEach((c, idx) => {
    const g = new T.Group();
    const spots = [[0, 0, 1.4], [0.024, 0.01, 1], [-0.022, 0.014, 1], [0.005, -0.026, 0.9], [-0.012, 0.03, 0.8]];
    spots.forEach((s, i) => {
      const h = new T.Group();
      const body = withInk(new T.Mesh(new T.BoxGeometry(0.02, 0.016, 0.02).translate(0, 0.008, 0), toon(houseCols[(idx + i) % 6])), 1.18);
      const roof = withInk(new T.Mesh(new T.ConeGeometry(0.019, 0.014, 4).rotateY(Math.PI / 4).translate(0, 0.023, 0), toon(0xb04a3a)), 1.18);
      h.add(body, roof);
      if (i === 0) { // little tower
        const tw = withInk(new T.Mesh(new T.CylinderGeometry(0.007, 0.009, 0.03, 8).translate(0, 0.03, 0), toon(0xfff2cc)), 1.18);
        const tr = withInk(new T.Mesh(new T.ConeGeometry(0.011, 0.016, 8).translate(0, 0.053, 0), toon(0x7b5cff)), 1.18);
        h.add(tw, tr);
      }
      h.position.set(s[0], 0, s[1]); h.scale.setScalar(s[2]);
      g.add(h);
    });
    g.scale.setScalar(1.5);
    placeOnSurface(g, c.n, 0.997, rng() * 6);
    planetGroup.add(g);
    const hit = new T.Mesh(new T.SphereGeometry(0.06, 8, 6), new T.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false }));
    hit.position.copy(c.n).multiplyScalar(1.02);
    hit.userData = { kind: 'city', ref: c };
    planetGroup.add(hit); pickables.push(hit);
    c.mesh = g;
    addLabel(c.name, c.n, 1.06, '', () => select('city', c));
  });

  /* Mount Fugi */
  const volcano = new T.Group();
  {
    const prof = [[0.17, 0], [0.13, 0.03], [0.085, 0.1], [0.055, 0.165], [0.04, 0.19], [0.029, 0.172], [0.0, 0.16]];
    const pts = prof.map(p => new T.Vector2(p[0], p[1]));
    const geo = new T.LatheGeometry(pts, 20);
    const cols = [0x7a5546, 0x6b4a3d, 0x573a32, 0x47302b, 0x3c2724, 0xff7a1f, 0xff5a10].map(c => new T.Color(c));
    const arr = new Float32Array(geo.attributes.position.count * 3);
    for (let i = 0; i < geo.attributes.position.count; i++) cols[i % prof.length].toArray(arr, i * 3);
    geo.setAttribute('color', new T.BufferAttribute(arr, 3));
    const body = new T.Mesh(geo, toon(0xffffff, { vertexColors: true, side: T.DoubleSide }));
    const ink = new T.Mesh(geo, inkMat); ink.scale.set(1.05, 1.02, 1.05); body.add(ink);
    volcano.add(body);
    // lava drips
    for (let i = 0; i < 4; i++) {
      const ang = i * 1.6 + 0.4;
      const drip = new T.Mesh(new T.CylinderGeometry(0.004, 0.009, 0.1, 5), new T.MeshBasicMaterial({ color: 0xff6a1a }));
      drip.position.set(Math.cos(ang) * 0.06, 0.12, Math.sin(ang) * 0.06);
      drip.rotation.set(Math.sin(ang) * 0.5, 0, -Math.cos(ang) * 0.5);
      volcano.add(drip);
    }
  }
  const glow = new T.Mesh(new T.CircleGeometry(0.03, 16).rotateX(-Math.PI / 2), new T.MeshBasicMaterial({ color: 0xffc03a }));
  glow.position.y = 0.172; volcano.add(glow);
  const lavaLight = new T.PointLight(0xff7a2a, 0, 0.8); lavaLight.position.y = 0.25; volcano.add(lavaLight);
  placeOnSurface(volcano, fugi.n, 0.995, 0);
  planetGroup.add(volcano);
  const fugiHit = new T.Mesh(new T.CylinderGeometry(0.1, 0.17, 0.2, 10).translate(0, 0.1, 0), new T.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false }));
  fugiHit.userData = { kind: 'volcano' }; volcano.add(fugiHit); pickables.push(fugiHit);
  addLabel('Mount Fugi', fugi.n, 1.2, 'volcano', () => select('volcano'));

  /* volcano particles */
  const partShader = (blend) => new T.ShaderMaterial({
    uniforms: { uScale: { value: 400 } },
    vertexShader: `attribute float size; attribute float alpha; attribute vec3 color; uniform float uScale; varying float vA; varying vec3 vC;
      void main(){ vA=alpha; vC=color; vec4 mv=modelViewMatrix*vec4(position,1.0); gl_PointSize=size*uScale/(-mv.z); gl_Position=projectionMatrix*mv; }`,
    fragmentShader: `varying float vA; varying vec3 vC; void main(){ float d=length(gl_PointCoord-0.5); float a=smoothstep(0.5,0.3,d)*vA; gl_FragColor=vec4(vC,a); }`,
    transparent: true, depthWrite: false, blending: blend,
  });
  function makeSystem(N, blend) {
    const g = new T.BufferGeometry();
    const A = { pos: new Float32Array(N * 3), col: new Float32Array(N * 3), size: new Float32Array(N), alpha: new Float32Array(N) };
    g.setAttribute('position', new T.BufferAttribute(A.pos, 3));
    g.setAttribute('color', new T.BufferAttribute(A.col, 3));
    g.setAttribute('size', new T.BufferAttribute(A.size, 1));
    g.setAttribute('alpha', new T.BufferAttribute(A.alpha, 1));
    const mat = partShader(blend);
    const pts = new T.Points(g, mat); pts.frustumCulled = false; volcano.add(pts);
    return { N, A, g, mat, vel: new Float32Array(N * 3), life: new Float32Array(N), max: new Float32Array(N), s0: new Float32Array(N), s1: new Float32Array(N), c0: new Float32Array(N * 3), c1: new Float32Array(N * 3), next: 0 };
  }
  const lava = makeSystem(420, T.AdditiveBlending);
  const smoke = makeSystem(320, T.NormalBlending);
  const emit = (S, p, v, life, s0, s1, c0, c1) => {
    const i = S.next; S.next = (S.next + 1) % S.N;
    S.A.pos.set(p, i * 3); S.vel.set(v, i * 3); S.life[i] = S.max[i] = life; S.s0[i] = s0; S.s1[i] = s1;
    S.c0.set(c0, i * 3); S.c1.set(c1, i * 3);
  };
  function stepSystem(S, dt, grav, drag) {
    for (let i = 0; i < S.N; i++) {
      if (S.life[i] <= 0) { S.A.alpha[i] = 0; continue; }
      S.life[i] -= dt;
      const k = Math.max(0, S.life[i] / S.max[i]), u = 1 - k;
      S.vel[i * 3 + 1] -= grav * dt;
      for (let a = 0; a < 3; a++) { S.vel[i * 3 + a] *= (1 - drag * dt); S.A.pos[i * 3 + a] += S.vel[i * 3 + a] * dt; }

  }
  let nowT = 0;
  tickers.push((t) => { nowT = t; for (const b of boats) updateBoat(b, t); });

  /* selected boat: name tag, story card, dotted past/future route, camera follow */
  const dotTex = (() => { const c = document.createElement('canvas'); c.width = c.height = 32; const x = c.getContext('2d'); x.fillStyle = '#fff'; x.beginPath(); x.arc(16, 16, 13, 0, 6.2832); x.fill(); return new T.CanvasTexture(c); })();
  const tag = document.createElement('div'); tag.className = 'label boat'; tag.style.display = 'none'; document.body.appendChild(tag);
  let sel = null, lastKey = '', lastEta = -1, zoomT = 0;
  const fmt = s => { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  function boatCard(b, force) {
    const c = b.cur, from = c.leg === 'out' ? b.A.name : b.B.name, to = c.leg === 'out' ? b.B.name : b.A.name;
    const logs = (c.leg === 'out' ? b.spec.logs : b.spec.blogs), li = Math.min(logs.length - 1, Math.floor(c.prog * logs.length));
    const key = c.leg + (c.docked ? 'd' : li);
    if (key === lastKey && !force) { if (Math.abs(c.eta - lastEta) >= 1) { lastEta = c.eta; const e = card.querySelector('.eta'); if (e) e.textContent = c.docked ? 'docked' : fmt(c.eta); } return; }
    lastKey = key; lastEta = c.eta;
    const cargo = c.leg === 'out' ? b.spec.out : b.spec.back;
    const story = c.docked ? `Docked at ${c.leg === 'out' ? b.B.name : b.A.name}. The crew are unloading and having a cup of tea.` : logs[li].replace('{from}', from).replace('{to}', to);
    cardH.textContent = b.spec.name;
    cardP.innerHTML = `<span class="meta">${b.spec.captain}</span><br>` +
      `<b>Route:</b> ${from} → ${to} · arriving <span class="eta">${c.docked ? 'docked' : fmt(c.eta)}</span><br>` +
      `<b>Carrying:</b> ${cargo}<br><i>${story}</i>`;
    card.classList.add('on'); card.dataset.boat = '1';
  }
  function clearBoat(hideCard) {
    if (!sel) return;
    planetGroup.remove(sel.past, sel.future); sel.past.geometry.dispose(); sel.future.geometry.dispose();
    sel = null; tag.style.display = 'none';
    controls.autoRotate = spinBtn.classList.contains('on');
    if (hideCard && card.dataset.boat) card.classList.remove('on');
    delete card.dataset.boat;
  }
  function selectBoat(b) {
    if (sel && sel.b === b) return;
    clearBoat(false);
    const dots = []; for (let i = 0; i < b.pts.length; i += 3) dots.push(b.pts[i]);
    const arr = new Float32Array(dots.length * 3); dots.forEach((v, i) => v.clone().multiplyScalar(1.007).toArray(arr, i * 3));
    const attr = new T.BufferAttribute(arr, 3), mk = (op, size) => {
      const g = new T.BufferGeometry(); g.setAttribute('position', attr);
      const p = new T.Points(g, new T.PointsMaterial({ map: dotTex, color: 0xffffff, size, sizeAttenuation: false, transparent: true, opacity: op, alphaTest: 0.25, depthWrite: false }));
      p.frustumCulled = false; p.renderOrder = 4; planetGroup.add(p); return p;
    };
    sel = { b, n: dots.length, past: mk(0.45, 5), future: mk(1, 7) };
    tag.textContent = b.spec.name; tag.style.display = 'block'; lastKey = ''; zoomT = 1.6;
    controls.autoRotate = false;
    updateBoat(b, nowT); boatCard(b, true);
  }
  const _c = new T.Vector3();
  tickers.push((t, dt) => {
    if (!sel) return;
    const b = sel.b, c = b.cur;
    const k = Math.min(sel.n, Math.floor(c.idx / 3));
    const outLeg = c.leg === 'out';
    sel.past.geometry.setDrawRange(outLeg ? 0 : k, outLeg ? k : sel.n - k);
    sel.future.geometry.setDrawRange(outLeg ? k : 0, outLeg ? sel.n - k : k);
    boatCard(b, false);
    // follow the boat unless the user is dragging
    if (!down) {
      const dist = camera.position.length(); _c.copy(camera.position).normalize();
      const a = 1 - Math.exp(-dt * 3);
      const ang = Math.acos(Math.min(1, _c.dot(b.n)));
      if (ang > 1e-4) { const sn = Math.sin(ang), w = Math.sin(a * ang) / sn; _c.multiplyScalar(Math.sin((1 - a) * ang) / sn).addScaledVector(b.n, w); }
      let nd = dist; if (zoomT > 0) { zoomT -= dt; nd += (2.1 - dist) * (1 - Math.exp(-dt * 3)); }
      camera.position.copy(_c.normalize()).multiplyScalar(nd);
    }
    // name tag next to the boat
    _c.copy(b.g.position).project(camera);
    const facing = b.n.dot(camera.position) - 1;
    tag.style.opacity = facing > 0.02 ? 1 : 0;
    tag.style.transform = `translate(${(_c.x * .5 + .5) * innerWidth + 20}px,${(-_c.y * .5 + .5) * innerHeight}px) translate(0,-50%)`;
  });
  console.log('boats', boats.map(b => b.spec.name + ': ' + b.A.name + ' -> ' + b.B.name + ' L=' + b.L.toFixed(2)).join(' | '), 'ports', ports.length);
  // whales
  const whales = [];
  for (let w = 0; w < 3; w++) {
    const n = oceanPt(0.25, 1, 0.5); if (!n) continue;
    const g = new T.Group();
    const stem = withInk(new T.Mesh(new T.CylinderGeometry(0.006, 0.011, 0.05, 8).translate(0, 0.025, 0), toon(0x4a63d8)), 1.2);
    const fl = (s) => { const f = withInk(new T.Mesh(new T.ConeGeometry(0.02, 0.03, 3).scale(1, 1, 0.3), toon(0x4a63d8)), 1.2); f.rotation.z = s * 1.0; f.position.set(s * 0.012, 0.058, 0); return f; };
    g.add(stem, fl(1), fl(-1));
    const ring = new T.Mesh(new T.RingGeometry(0.018, 0.024, 24).rotateX(-Math.PI / 2), new T.MeshBasicMaterial({ color: 0xffffff, transparent: true, depthWrite: false, side: T.DoubleSide }));
    ring.position.y = 0.002; g.add(ring);
    placeOnSurface(g, n, 1.0, rng() * 6);
    planetGroup.add(g);
    whales.push({ g, stem, ring, ph: rng() * 20, per: 9 + rng() * 5 });
  }
  tickers.push((t) => {
    for (const w of whales) {
      const k = ((t + w.ph) % w.per) / w.per;      // 0..1
      const up = k < 0.22 ? Math.sin(k / 0.22 * Math.PI) : 0;
      w.g.children.forEach(c => { if (c !== w.ring) c.visible = up > 0.02; });
      w.g.children.forEach(c => { if (c !== w.ring) c.scale.y = Math.max(0.01, up); });
      const rk = Math.min(1, Math.max(0, (k - 0.02) / 0.3));
      w.ring.scale.setScalar(0.5 + rk * 2.2); w.ring.material.opacity = (1 - rk) * (rk > 0 ? 0.8 : 0);
      w.ring.visible = rk > 0 && rk < 1;
    }
  });
  // birds
  const birds = [];
  const birdGeo = new T.BufferGeometry();
  birdGeo.setAttribute('position', new T.BufferAttribute(new Float32Array([0, 0, 0, -0.02, 0, 0.025, 0.005, 0, 0.0]), 3));
  birdGeo.computeVertexNormals();
  const birdMat = new T.MeshBasicMaterial({ color: 0xffffff, side: T.DoubleSide });
  [cities[0], cities[3], cities[6], cities[8]].forEach((c, ci) => {
    const [u, w] = perpFrame(c.n);
    for (let i = 0; i < 4; i++) {
      const g = new T.Group();
      const wl = new T.Mesh(new T.PlaneGeometry(0.026, 0.012).translate(-0.013, 0, 0), birdMat);
      const wr = new T.Mesh(new T.PlaneGeometry(0.026, 0.012).translate(0.013, 0, 0), birdMat);
      wl.rotation.x = wr.rotation.x = -Math.PI / 2;
      const body = new T.Mesh(new T.SphereGeometry(0.006, 6, 4), new T.MeshBasicMaterial({ color: 0xffe8a8 }));
      g.add(wl, wr, body); planetGroup.add(g);
      birds.push({ g, wl, wr, c, u, w, ph: i * 0.5 + ci, rad: 0.1 + i * 0.012, sp: 0.35 + ci * 0.05, h: 1.07 + i * 0.012 });
    }
  });
  const _p = new T.Vector3(), _p2 = new T.Vector3(), _ff = new T.Vector3(), _rr = new T.Vector3();
  tickers.push((t) => {
    for (const b of birds) {
      const at = (a, out) => out.copy(b.c.n).addScaledVector(b.u, Math.cos(a) * b.rad).addScaledVector(b.w, Math.sin(a) * b.rad).normalize().multiplyScalar(b.h);
      const a = t * b.sp + b.ph;
      at(a, _p); at(a + 0.05, _p2);
      b.g.position.copy(_p);
      _ff.copy(_p2).sub(_p).normalize(); _rr.copy(_p).normalize();
      _ff.addScaledVector(_rr, -_ff.dot(_rr)).normalize();
      // x = side, y = up, z = forward (right-handed: x = y cross z)
      _m.makeBasis(new T.Vector3().crossVectors(_rr, _ff), _rr, _ff);
      b.g.quaternion.setFromRotationMatrix(_m);
      const fl = Math.sin(t * 9 + b.ph * 5) * 0.7;
      b.wl.rotation.z = fl; b.wr.rotation.z = -fl;
    }
  });

  /* UI lists */
  const list = document.getElementById('places');
  list.innerHTML = '<div class="sec">Cities</div>';
  const mk = (txt, fn) => { const b = document.createElement('button'); b.textContent = txt; b.onclick = fn; list.appendChild(b); };
  cities.forEach(c => mk(c.name, () => select('city', c)));
  list.insertAdjacentHTML('beforeend', '<div class="sec">Wonders</div>');
  mk('Mount Fugi', () => select('volcano'));
  mk('Hurricane Nanette', () => select('storm'));

  world = { P, cities, fugi, stormN, erupt, zap, boats, selectBoat, clearBoat, boatSelected: () => !!sel };
  const q = new URLSearchParams(location.search).get('go');   // e.g. ?go=volcano | storm | city3
  if (q) setTimeout(() => { controls.autoRotate = false;
    if (q.startsWith('boat')) { const b = boats[+q.slice(4)]; selectBoat(b); camera.position.copy(b.n).multiplyScalar(+(new URLSearchParams(location.search).get('d') || 2.1)); controls.update(); return; }
    const n = q === 'volcano' ? fugi.n : q === 'storm' ? stormN : cities[+q.slice(4)].n;
    camera.position.copy(n).multiplyScalar(+(new URLSearchParams(location.search).get('d') || 1.8)); controls.update();
    q === 'volcano' ? erupt() : q === 'storm' ? zap() : 0; }, 200);
  console.log('Nathaniel Planet built', { cities: cities.map(c => [c.name, c.biome]), mountains: mtnN.length, boats: boats.length, whales: whales.length });
  planetGroup.userData.planet = planet; pickables.push(planet);
  planet.userData = { kind: 'planet' };
}

/* ---------- labels ---------- */
function addLabel(text, n, r, cls, onClick) {
  const el = document.createElement('div');
  el.className = 'label ' + cls; el.textContent = text;
  el.addEventListener('click', onClick);
  document.body.appendChild(el);
  labels.push({ el, pos: n.clone().multiplyScalar(r), n: n.clone() });
}
const _v = new T.Vector3();
function updateLabels() {
  const w = innerWidth, h = innerHeight, cp = camera.position, d = cp.length();
  for (const L of labels) {
    const facing = L.n.dot(cp) - 1;                 // >0: on the visible hemisphere
    _v.copy(L.pos).project(camera);
    const show = facing > 0.04 && d < 4.4 && _v.z < 1;
    L.el.style.opacity = show ? Math.min(1, facing * 6) : 0;
    L.el.style.pointerEvents = show ? 'auto' : 'none';
    L.el.style.transform = `translate(${(_v.x * .5 + .5) * w}px,${(-_v.y * .5 + .5) * h}px) translate(-50%,-135%)`;
  }
}

/* ---------- cards, selection, fly-to ---------- */
const card = document.getElementById('card'), cardH = card.querySelector('h2'), cardP = card.querySelector('p');
function showCard(h, p) { cardH.textContent = h; cardP.textContent = p; card.classList.add('on'); }
document.getElementById('cardX').onclick = () => { card.classList.remove('on'); if (world) world.clearBoat(false); };

const STORM_LINES = ['Zap! Hurricane Nanette is not amused.', 'Boom! It has been spinning for 900 years and is very dizzy.', 'Crackle! Nobody dares go near it, except one small boat.'];
const FUGI_LINES = ['Mount Fugi is huge, grumpy, and erupts when poked. You just poked it.', 'KABOOM! Mount Fugi says it was only clearing its throat.', 'Mount Fugi has erupted 3,000 times. It still finds it exciting.'];
let lineI = 0;
function select(kind, c) {
  let n, dist = 2.0;
  if (kind === 'boat') { world.selectBoat(c); return; }
  world.clearBoat(false); delete card.dataset.boat;
  if (kind === 'city') { n = c.n; showCard(c.name, c.info); }
  else if (kind === 'volcano') { n = world.fugi.n; dist = 1.9; world.erupt(); showCard('Mount Fugi', FUGI_LINES[lineI++ % 3]); }
  else if (kind === 'storm') { n = world.stormN; dist = 2.2; world.zap(); showCard('Hurricane Nanette', STORM_LINES[lineI++ % 3]); }
  flyTo(n, dist);
}
let fly = null;
function flyTo(n, dist) {
  const from = camera.position.clone();
  fly = { t: 0, a: from.clone().normalize(), b: n.clone().normalize(), d0: from.length(), d1: Math.min(Math.max(dist, controls.minDistance), controls.maxDistance) };
}
function stepFly(dt) {
  if (!fly) return;
  fly.t = Math.min(1, fly.t + dt / 1.3);
  const e = fly.t < .5 ? 2 * fly.t * fly.t : 1 - Math.pow(-2 * fly.t + 2, 2) / 2;
  const dir = fly.a.clone().lerp(fly.b, e).normalize();
  // spherical interpolation keeps it smooth for large angles
  const ang = Math.acos(Math.min(1, fly.a.dot(fly.b)));
  if (ang > 1e-3) {
    const s = Math.sin(ang);
    dir.copy(fly.a).multiplyScalar(Math.sin((1 - e) * ang) / s).addScaledVector(fly.b, Math.sin(e * ang) / s);
  }
  camera.position.copy(dir).multiplyScalar(fly.d0 + (fly.d1 - fly.d0) * e);
  if (fly.t >= 1) fly = null;
}

/* ---------- input ---------- */
const ray = new T.Raycaster(), mouse = new T.Vector2();
let down = null;
function pick(ev) {
  const r = canvas.getBoundingClientRect();
  mouse.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(mouse, camera);
  const hits = ray.intersectObjects(pickables, false);
  // strip hits hidden behind the planet itself
  for (const h of hits) { if (h.object.userData.kind === 'planet') return null; return h.object.userData; }
  return null;
}
canvas.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY }; fly = null; });
canvas.addEventListener('pointerup', e => {
  if (!down || !world) return;
  const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y); down = null;
  if (moved > 6) return;
  const u = pick(e); if (!u) { world.clearBoat(true); return; }
  if (u.kind === 'city' || u.kind === 'boat') select(u.kind, u.ref); else select(u.kind);
});
canvas.addEventListener('pointermove', e => {
  if (!world) return;
  if (e.buttons) { if (down && world.boatSelected() && Math.hypot(e.clientX - down.x, e.clientY - down.y) > 8) world.clearBoat(true); return; }
  document.body.classList.toggle('pointer', !!pick(e));
});

const spinBtn = document.getElementById('spin');
spinBtn.onclick = () => { controls.autoRotate = !controls.autoRotate; spinBtn.classList.toggle('on', controls.autoRotate); spinBtn.textContent = controls.autoRotate ? 'Spinning' : 'Paused'; };
document.getElementById('placesBtn').onclick = e => { document.getElementById('places').classList.toggle('on'); e.currentTarget.classList.toggle('on'); };
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); spinBtn.click(); } });

/* ---------- loop ---------- */
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  if (w / h < 0.9) camera.fov = 58; else camera.fov = 42; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

let last = performance.now(), time = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now; time += dt;
  starMat.uniforms.time.value = time;
  stepFly(dt);
  controls.rotateSpeed = 0.25 + (camera.position.length() - 1.5) * 0.18;
  controls.update();
  for (const f of tickers) f(time, dt);
  updateLabels();
  renderer.render(scene, camera);
}
requestAnimationFrame(frame);
requestAnimationFrame(() => setTimeout(() => {
  build();
  const l = document.getElementById('loading'); l.style.opacity = 0; setTimeout(() => l.remove(), 700);
}, 30));
})();
</script>
</body>
