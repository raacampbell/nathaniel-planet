<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Nathaniel Planet</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a0420">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nathaniel Planet">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0a0420; --card:#1b1040e6; --edge:#7b5cff; --txt:#f4f0ff; --dim:#b9aee8; --accent:#ffd84d;
    --font:'Fredoka','Comic Sans MS','Chalkboard SE',ui-rounded,system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{touch-action:none;overscroll-behavior:none;-webkit-text-size-adjust:100%;margin:0;height:100%;background:#000005;overflow:hidden;font-family:var(--font);color:var(--txt)}
  canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #title{position:fixed;left:20px;top:16px;pointer-events:none}
  #title h1{margin:0;font-size:clamp(22px,4vw,36px);font-weight:600;letter-spacing:.5px;
    text-shadow:0 3px 0 #3b1fa3,0 0 18px #6a8cff99}
  #title p{margin:2px 0 0;color:var(--dim);font-size:14px}
  .label{position:fixed;left:0;top:0;pointer-events:auto;cursor:pointer;white-space:nowrap;
    font-size:13px;font-weight:600;padding:2px 9px 3px;border-radius:999px;color:#2a1450;
    background:#fff8d6;border:2px solid #2a1450;box-shadow:0 2px 0 #2a1450;transform:translate(-50%,-135%);
    opacity:0;transition:opacity .2s;will-change:transform}
  .label.volcano{background:#ff8a3d;color:#3a0d00;border-color:#3a0d00;box-shadow:0 2px 0 #3a0d00;font-size:15px}
  .label.storm{background:#d8e9ff;color:#122a5c;border-color:#122a5c;box-shadow:0 2px 0 #122a5c}
  .label:hover{background:var(--accent)}
  .label.boat{background:#fff;color:#12306a;border-color:#12306a;box-shadow:0 2px 0 #12306a;font-size:14px;pointer-events:none}
  #card .meta{color:var(--dim);font-size:13px}
  #card p b{color:var(--accent);font-weight:600}
  #card i{display:block;margin-top:6px;color:#e9e3ff}
  #card{z-index:20;position:fixed;left:50%;bottom:64px;transform:translate(-50%,20px);width:min(440px,calc(100% - 32px));
    background:var(--card);border:2px solid var(--edge);border-radius:18px;padding:14px 18px 14px;
    backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:.25s}
  #card.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
  #card h2{margin:0 0 4px;font-size:20px;color:var(--accent)}
  #card p{margin:0;font-size:15px;line-height:1.35}
  #card button{position:absolute;right:10px;top:8px;background:none;border:0;color:var(--dim);font:inherit;font-size:20px;cursor:pointer}
  #bar{position:fixed;right:14px;top:calc(env(safe-area-inset-top,0px) + 33px);display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  .btn{font:inherit;font-size:14px;color:var(--txt);background:#1b1040cc;border:2px solid var(--edge);
    border-radius:999px;padding:7px 14px;cursor:pointer;backdrop-filter:blur(4px)}
  .btn:hover,.btn.on{background:#3b1fa3}
  .btn.round{width:38px;height:38px;padding:0;display:grid;place-items:center;background:transparent;backdrop-filter:none;border-color:#ffffff66;color:#ffffffcc}
  .btn.round:hover{background:#ffffff26}
  .btn.round svg{display:block}
  #bar .btn.round{background:#1b1040b3;border-color:var(--edge);color:#fff;backdrop-filter:blur(4px)}
  #bar .btn.round:hover,#bar .btn.round.on{background:#3b1fa3}
  #updBtn{position:fixed;right:14px;bottom:14px;z-index:21}
  .btn.round.on{background:#ffffff33;border-color:#fff}
  .btn.round.checking svg{animation:updspin .9s linear infinite}
  .btn.round.avail{border-color:var(--accent);color:var(--accent);animation:updjiggle 2.6s ease-in-out infinite}
  @keyframes updspin{to{transform:rotate(360deg)}}
  @keyframes updjiggle{0%,45%,100%{transform:rotate(0)}8%{transform:rotate(-13deg)}16%{transform:rotate(11deg)}24%{transform:rotate(-8deg)}32%{transform:rotate(5deg)}40%{transform:rotate(-2deg)}}
  #updMsg{position:fixed;right:60px;bottom:19px;z-index:21;font-size:13px;padding:4px 12px;border-radius:999px;background:var(--card);border:2px solid var(--edge);opacity:0;transition:opacity .3s;pointer-events:none}
  #updMsg.on{opacity:1}
  #places{position:fixed;right:14px;top:calc(env(safe-area-inset-top,0px) + 81px);width:210px;max-height:calc(100% - 170px);overflow:auto;
    background:var(--card);border:2px solid var(--edge);border-radius:16px;padding:8px;display:none}
  #places.on{display:block}
  #places button{display:block;width:100%;text-align:left;font:inherit;font-size:14px;color:var(--txt);
    background:none;border:0;border-radius:10px;padding:7px 10px;cursor:pointer}
  #places button:hover{background:#3b1fa3}
  #places .sec{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);padding:6px 10px 2px}
  #loading{touch-action:none;position:fixed;inset:0;display:grid;place-items:center;background:#000005;font-size:22px;z-index:9;transition:opacity .6s}
  body.pointer canvas#c{cursor:pointer}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title"><h1>Nathaniel Planet</h1><p>Anton's vision of another world</p></div>
<div id="bar">
  <button class="btn round" id="cityBtn" aria-label="Cities" title="Cities"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21V12l4-3 4 3v9"/><path d="M11 21V8h5v13"/><path d="M16 21v-7h5v7"/><path d="M13.5 8V3.5l3 1.2-3 1.2"/><path d="M2 21h20"/></svg></button>
  <button class="btn round" id="wonderBtn" aria-label="Wonders" title="Wonders"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21l6.5-12h5L21 21z"/><path d="M12 6V2.5M8.5 5L6.5 2.5M15.5 5l2-2.5"/></svg></button>
</div>
<button class="btn round" id="updBtn" aria-label="Check for updates" title="Check for updates"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg></button>
  <div id="updMsg"></div>
<div id="places"></div>
<div id="card"><button id="cardX" aria-label="close">×</button><h2></h2><p></p></div>
<div id="loading">Making a planet…</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="planet-gen.js"></script>
<script>
(function () {
'use strict';
const T = THREE;
const SEED = 101;

/* ---------- content ---------- */
const CITY_INFO = [
  ['Nate Zealand', 'Famous for sheep that knit their own sweaters.'],
  ['Noranta', 'Its streets get repainted a different colour every Tuesday.'],
  ['Nephatal', 'Home of the tallest sandcastle in the world. It has stood for 400 years.'],
  ['Nimbleton', 'Everyone here walks on tiptoe, just in case.'],
  ['Snorfen', 'A very sleepy town. The mayor naps through every speech.'],
  ['Gnarlyburg', 'Built inside one enormous, twisty tree.'],
  ['Tanglenook', 'Nobody has ever found the way out. Nobody minds.'],
  ['Quonkle', 'Population: 12 people and 4,000 frogs.'],
  ['Nubbin Bay', 'The seagulls here play the bagpipes. Badly, and proudly.'],
  ['Wibblenon', 'A wobbly city that sways gently in the breeze.'],
  ['Fizzlewick', 'Everything here is fizzy, even the rivers. Residents burp politely hello.'],
  ['Pudding Rock', 'A mountain made of pudding, repaired every spring with custard.'],
  ['Mumblesby', 'Nobody has understood the mayor since 1904. He is re-elected every year.'],
  ['Toastwick', 'Heated by one enormous toaster. It smells wonderful all day.'],
  ['Hiccup Harbour', 'Every boat that docks gives a little hiccup. It is considered good luck.'],
  ['Spindlewood', 'The houses stand on stilts, and the stilts stand on smaller stilts.'],
  ['Bumblepuff', 'A town made of cloud that landed by mistake and decided to stay.'],
  ['Ottermere', 'Run entirely by otters. The mayor is permanently damp.'],
  ['Crumpet Cove', 'Has more crumpets than people. The exact ratio is disputed.'],
  ['Zigzagton', 'No road here goes straight. The postman is extremely fit.'],
];

/* ---------- renderer / scene ---------- */
const canvas = document.getElementById('c');
const renderer = new T.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0x000005);
const scene = new T.Scene();
const camera = new T.PerspectiveCamera(42, 1, 0.05, 400);
camera.position.set(0.9, 0.7, 3.3);
scene.add(camera);

const sun = new T.DirectionalLight(0xffffff, 0.62);
sun.position.set(-2, 2.2, 3);
camera.add(sun);
scene.add(new T.AmbientLight(0xffffff, 0.66));

const controls = new T.OrbitControls(camera, canvas);
controls.enablePan = false;
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.minDistance = 1.25;
controls.maxDistance = 6;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.6;

const planetGroup = new T.Group();
scene.add(planetGroup);

const toonGrad = (() => {
  const d = new Uint8Array([95, 140, 185, 225, 255]);
  const t = new T.DataTexture(d, 5, 1, T.LuminanceFormat);
  t.minFilter = t.magFilter = T.NearestFilter; t.needsUpdate = true; return t;
})();
const toon = (color, extra) => new T.MeshToonMaterial(Object.assign({ color, gradientMap: toonGrad }, extra || {}));
const inkMat = new T.MeshBasicMaterial({ color: 0x120a2a, side: T.BackSide });
function withInk(mesh, s) { const o = new T.Mesh(mesh.geometry, inkMat); o.scale.setScalar(s || 1.12); mesh.add(o); return mesh; }

const UP = new T.Vector3(0, 1, 0);
function placeOnSurface(obj, n, radius, spin) {
  obj.position.copy(n).multiplyScalar(radius || 1);
  obj.quaternion.setFromUnitVectors(UP, n);
  if (spin) obj.rotateY(spin);
}
const v3 = a => new T.Vector3(a[0], a[1], a[2]);
const angle = (a, b) => Math.acos(Math.min(1, Math.max(-1, a.dot(b))));

/* ---------- stars ---------- */
let starMat = null;
(function () {
  const n = 6000, pos = new Float32Array(n * 3), col = new Float32Array(n * 3),
        size = new Float32Array(n), phase = new Float32Array(n);
  const rng = PlanetGen.mulberry32(5);
  const tints = [[1, 1, 1], [1, .93, .75], [.75, .85, 1], [1, .8, .85]];
  const bn = new T.Vector3(0.42, 0.88, 0.2).normalize(), e1 = new T.Vector3().crossVectors(bn, new T.Vector3(0, 0, 1)).normalize(), e2 = new T.Vector3().crossVectors(bn, e1);
  const gauss = () => (rng() + rng() + rng() + rng() - 2) / 2;
  for (let i = 0; i < n; i++) {
    const R = 120; let x, y, z;
    if (i < n * 0.38) {                  // a crowd of fainter stars along the milky way
      const a = rng() * 6.2832, o = gauss() * 0.3;
      const d = new T.Vector3().addScaledVector(e1, Math.cos(a)).addScaledVector(e2, Math.sin(a)).addScaledVector(bn, o).normalize();
      x = d.x; y = d.y; z = d.z;
    } else { z = rng() * 2 - 1; const t = rng() * 6.2832, r = Math.sqrt(1 - z * z); x = r * Math.cos(t); y = z; z = r * Math.sin(t); }
    pos.set([R * x, R * y, R * z], i * 3);
    col.set(tints[Math.floor(rng() * tints.length)], i * 3);
    size[i] = rng() < 0.06 ? 6 + rng() * 5 : (i < n * 0.38 ? 1.4 + rng() * 1.8 : 1.8 + rng() * 2.6);
    phase[i] = rng() * 6.28;
  }
  const g = new T.BufferGeometry();
  g.setAttribute('position', new T.BufferAttribute(pos, 3));
  g.setAttribute('color', new T.BufferAttribute(col, 3));
  g.setAttribute('size', new T.BufferAttribute(size, 1));
  g.setAttribute('phase', new T.BufferAttribute(phase, 1));
  const m = new T.ShaderMaterial({
    uniforms: { time: { value: 0 }, pr: { value: renderer.getPixelRatio() } },
    vertexShader: `attribute float size; attribute float phase; attribute vec3 color; uniform float time; uniform float pr;
      varying vec3 vC; varying float vT;
      void main(){ vC=color; vT=0.65+0.35*sin(time*1.4+phase);
        gl_PointSize=size*pr*(0.8+0.2*vT); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);} `,
    fragmentShader: `varying vec3 vC; varying float vT;
      void main(){ float d=length(gl_PointCoord-0.5); float a=smoothstep(0.5,0.1,d)*vT; gl_FragColor=vec4(vC,a);} `,
    transparent: true, depthWrite: false,
  });
  const pts = new T.Points(g, m); pts.frustumCulled = false; scene.add(pts);
  starMat = m;
})();


/* ---------- build the world (after first paint) ---------- */
let world = null;
const pickables = [];
const labels = [];
const tickers = [];   // functions(t, dt)
// The globe is now 1.5x wider again (radius x 2.12 in total). The scene is kept in unit-sphere
// coordinates, so every object on it is shrunk by K: cities, ships etc. stay the size they were.
const GROW = 1.25;                          // globe area x1.5625 on top of the 1.5x-wide planet (two +25% steps)
const RK = 1 / GROW;                           // size factor for things not scaled by K (track, town squares)
const K = Math.SQRT1_2 / 1.5 * RK;

/* merge many small static meshes into two draw calls (coloured + ink outline) */
function mergeParts(parts) {            // parts: [[geometry, THREE.Color], ...] -> vertex-coloured, non-indexed
  let n = 0; const gs = parts.map(([g, c]) => { const q = g.index ? g.toNonIndexed() : g; n += q.attributes.position.count; return [q, c]; });
  const p = new Float32Array(n * 3), nm = new Float32Array(n * 3), cl = new Float32Array(n * 3); let o = 0;
  for (const [g, c] of gs) {
    const cnt = g.attributes.position.count;
    p.set(g.attributes.position.array, o * 3); nm.set(g.attributes.normal.array, o * 3);
    for (let i = 0; i < cnt; i++) { cl[(o + i) * 3] = c.r; cl[(o + i) * 3 + 1] = c.g; cl[(o + i) * 3 + 2] = c.b; }
    o += cnt;
  }
  const geo = new T.BufferGeometry();
  geo.setAttribute('position', new T.BufferAttribute(p, 3)); geo.setAttribute('normal', new T.BufferAttribute(nm, 3)); geo.setAttribute('color', new T.BufferAttribute(cl, 3));
  return geo;
}
function makeBaker() {
  const col = [], ink = [];
  return {
    add(root) {
      root.updateMatrixWorld(true);
      root.traverse(o => {
        if (!o.isMesh) return;
        const g = o.geometry.clone(); g.applyMatrix4(o.matrixWorld);
        if (!g.attributes.normal) g.computeVertexNormals();
        if (o.material === inkMat) ink.push([g, new T.Color(0)]); else col.push([g, o.material.color]);
      });
    },
    finish(parent) {
      if (col.length) parent.add(new T.Mesh(mergeParts(col), toon(0xffffff, { vertexColors: true })));
      if (ink.length) parent.add(new T.Mesh(mergeParts(ink), inkMat));
    },
  };
}
/* a bumpy, craggy cone */
function craggyCone(r, h, radial, heightSeg, jitter, seed) {
  const g = new T.ConeGeometry(r, h, radial, heightSeg, false); g.translate(0, h / 2, 0);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    const k = y / h;                      // 0 base .. 1 tip
    if (k > 0.97) continue;
    const q = Math.sin((Math.round(x * 4000) * 12.9898 + Math.round(z * 4000) * 78.233 + Math.round(y * 4000) * 37.719 + seed) * 43758.5453);
    const hh = (q - Math.floor(q)) - 0.5;
    const s = 1 + hh * jitter * (1 - k * 0.4);
    p.setXYZ(i, x * s, y + hh * jitter * h * 0.07 * (k > 0.02 ? 1 : 0), z * s);
  }
  g.computeVertexNormals();
  return g;
}

function build() {
  const P = PlanetGen.createPlanet(SEED);
  const rng = PlanetGen.mulberry32(77);

  /* ---- the milky way: baked once into an equirectangular texture, shown on a far sky sphere ---- */
  {
    const bn = new T.Vector3(0.42, 0.88, 0.2).normalize();
    const e1 = new T.Vector3().crossVectors(bn, new T.Vector3(0, 0, 1)).normalize();
    const hashFn = `float hash(vec3 p){ p=fract(p*0.3183099+.1); p*=17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
      float vnoise(vec3 x){ vec3 i=floor(x), f=fract(x); f=f*f*(3.-2.*f);
        return mix(mix(mix(hash(i),hash(i+vec3(1,0,0)),f.x), mix(hash(i+vec3(0,1,0)),hash(i+vec3(1,1,0)),f.x),f.y),
                   mix(mix(hash(i+vec3(0,0,1)),hash(i+vec3(1,0,1)),f.x), mix(hash(i+vec3(0,1,1)),hash(i+vec3(1,1,1)),f.x),f.y), f.z); }
      float fbm(vec3 p){ float s=0., a=.5; for(int i=0;i<5;i++){ s+=a*vnoise(p); p=p*2.03+vec3(1.7,9.2,3.1); a*=.5; } return s; }`;
    const rt = new T.WebGLRenderTarget(2048, 1024, { minFilter: T.LinearFilter, magFilter: T.LinearFilter, depthBuffer: false, generateMipmaps: false });
    const quad = new T.Mesh(new T.PlaneGeometry(2, 2), new T.ShaderMaterial({
      uniforms: { uN: { value: bn }, uE: { value: e1 } },
      vertexShader: 'varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.,1.); }',
      fragmentShader: `varying vec2 vUv; uniform vec3 uN; uniform vec3 uE; ${hashFn}
        void main(){
          float lon=vUv.x*6.2831853, lat=(vUv.y-.5)*3.14159265;
          vec3 d=vec3(cos(lon)*cos(lat), sin(lat), sin(lon)*cos(lat));
          float l=dot(d,uN);
          float core=exp(-l*l/0.05), wide=exp(-l*l/0.2);
          vec3 w=vec3(fbm(d*2.0+3.0), fbm(d*2.0+11.0), fbm(d*2.0+23.0))-.5;
          float cloud=fbm(d*3.6+w*1.7);
          float dens=core*(0.3+1.0*cloud)+wide*0.22*cloud;
          float dust=smoothstep(0.46,0.72,fbm(d*7.5+w*2.2))*exp(-l*l/0.022);   // dark dust lanes
          dens*=1.0-0.8*dust;
          dens*=0.55+0.7*max(0.0,dot(d,uE))+0.25*fbm(d*1.3);                  // brighter towards one end
          vec3 c=mix(vec3(0.16,0.2,0.5), vec3(0.95,0.76,0.6), clamp(core*cloud*1.4,0.,1.));
          vec3 col=vec3(0.0,0.0,0.02)+c*dens*0.68;
          gl_FragColor=vec4(col,1.);
        }`,
    }));
    const qs = new T.Scene(); qs.add(quad);
    renderer.setRenderTarget(rt); renderer.render(qs, new T.Camera()); renderer.setRenderTarget(null);
    const sky = new T.Mesh(new T.SphereGeometry(180, 48, 32), new T.ShaderMaterial({
      side: T.BackSide, depthWrite: false, depthTest: false, uniforms: { tMW: { value: rt.texture } },
      vertexShader: 'varying vec3 vD; void main(){ vD=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
      fragmentShader: `varying vec3 vD; uniform sampler2D tMW;
        void main(){ vec3 d=normalize(vD); vec2 uv=vec2(fract(atan(d.z,d.x)/6.2831853), asin(clamp(d.y,-1.,1.))/3.14159265+0.5);
          vec3 c=texture2D(tMW,uv).rgb; c+=(fract(sin(dot(gl_FragCoord.xy,vec2(12.9898,78.233)))*43758.5453)-.5)/255.; gl_FragColor=vec4(c,1.); }`,
    }));
    sky.renderOrder = -10; sky.frustumCulled = false; scene.add(sky);
  }

  /* ---- planet surface: cartoon texture (quick low-res now, full-res from a worker) + animated waves ---- */
  const maxAniso = renderer.capabilities.getMaxAnisotropy();
  const planetMat = new T.MeshLambertMaterial({ map: null });
  const wave = { time: { value: 0 }, mask: { value: null } };
  planetMat.onBeforeCompile = sh => {
    sh.uniforms.uTime = wave.time; sh.uniforms.uMask = wave.mask;
    sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nvarying vec3 vObj;')
      .replace('#include <begin_vertex>', '#include <begin_vertex>\nvObj = position;');
    sh.fragmentShader = sh.fragmentShader.replace('#include <common>', '#include <common>\nvarying vec3 vObj; uniform float uTime; uniform sampler2D uMask;')
      .replace('#include <map_fragment>', `#include <map_fragment>
      {
        vec3 q = normalize(vObj);
        vec3 wq = q * 1.5;
        float m = texture2D(uMask, vec2(fract(atan(q.z, -q.x) / 6.2831853), acos(clamp(q.y, -1.0, 1.0)) / 3.14159265)).r;
        if (m > 0.01) {
          float t = uTime;

  setInterval(() => check(false), 10 * 60 * 1000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && Date.now() - lastCheck > 60000) check(false); });
})();
</script>
