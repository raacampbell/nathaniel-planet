<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Nathaniel Planet</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a0420">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nathaniel Planet">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0a0420; --card:#1b1040e6; --edge:#7b5cff; --txt:#f4f0ff; --dim:#b9aee8; --accent:#ffd84d;
    --font:'Fredoka','Comic Sans MS','Chalkboard SE',ui-rounded,system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{touch-action:none;overscroll-behavior:none;-webkit-text-size-adjust:100%;margin:0;height:100%;background:#000005;overflow:hidden;font-family:var(--font);color:var(--txt)}
  canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #title{position:fixed;left:20px;top:16px;pointer-events:none}
  #title h1{margin:0;font-size:clamp(22px,4vw,36px);font-weight:600;letter-spacing:.5px;
    text-shadow:0 3px 0 #3b1fa3,0 0 18px #6a8cff99}
  #title p{margin:2px 0 0;color:var(--dim);font-size:14px}
  .label{position:fixed;left:0;top:0;pointer-events:auto;cursor:pointer;white-space:nowrap;
    font-size:13px;font-weight:600;padding:2px 9px 3px;border-radius:999px;color:#2a1450;
    background:#fff8d6;border:2px solid #2a1450;box-shadow:0 2px 0 #2a1450;transform:translate(-50%,-135%);
    opacity:0;transition:opacity .2s;will-change:transform}
  .label.volcano{background:#ff8a3d;color:#3a0d00;border-color:#3a0d00;box-shadow:0 2px 0 #3a0d00;font-size:15px}
  .label.storm{background:#d8e9ff;color:#122a5c;border-color:#122a5c;box-shadow:0 2px 0 #122a5c}
  .label.falls{background:#ffdcee;color:#6a1240;border-color:#6a1240;box-shadow:0 2px 0 #6a1240;font-size:15px}
  .label.glacier{background:#e4fbff;color:#0a4a5c;border-color:#0a4a5c;box-shadow:0 2px 0 #0a4a5c;font-size:15px}
  .label.lake{background:#eaf6ff;color:#123a5c;border-color:#123a5c;box-shadow:0 2px 0 #123a5c}
  .label:hover{background:var(--accent)}
  .label.boat{background:#fff;color:#12306a;border-color:#12306a;box-shadow:0 2px 0 #12306a;font-size:14px;pointer-events:none}
  #card .meta{color:var(--dim);font-size:13px}
  #card p b{color:var(--accent);font-weight:600}
  #card i{display:block;margin-top:6px;color:#e9e3ff}
  #card{z-index:20;position:fixed;left:50%;bottom:64px;transform:translate(-50%,20px);width:min(480px,calc(100% - 32px));
    background:var(--card);border:2px solid var(--edge);border-radius:18px;padding:14px 18px 14px;
    backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:.25s;display:flex;gap:12px;align-items:flex-start}
  #card.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
  #card h2{margin:0 0 4px;font-size:20px;color:var(--accent)}
  #card p{margin:0 0 10px;font-size:15.5px;line-height:1.42}
  #card p:last-child{margin-bottom:0}
  #card button{position:absolute;right:10px;top:8px;background:none;border:0;color:var(--dim);font:inherit;font-size:20px;cursor:pointer}
  #cardTxt{flex:1 1 auto;min-width:0}
  #cardBody{max-height:min(46vh,340px);overflow-y:auto;padding-right:6px}
  #cardPic{display:none;flex:0 0 auto;width:112px;height:112px;border-radius:14px;border:2px solid var(--edge);background:#0a0420;margin-top:2px}
  #card.pic #cardPic{display:block}
  #bar{position:fixed;right:14px;top:calc(env(safe-area-inset-top,0px) + 14px);display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  .btn{font:inherit;font-size:14px;color:var(--txt);background:#1b1040cc;border:2px solid var(--edge);
    border-radius:999px;padding:7px 14px;cursor:pointer;backdrop-filter:blur(4px)}
  .btn:hover,.btn.on{background:#3b1fa3}
  .btn.round{width:38px;height:38px;padding:0;display:grid;place-items:center;background:transparent;backdrop-filter:none;border-color:#ffffff66;color:#ffffffcc}
  .btn.round:hover{background:#ffffff26}
  .btn.round svg{display:block}
  #bar .btn.round{background:#1b1040b3;border-color:var(--edge);color:#fff;backdrop-filter:blur(4px)}
  #bar .btn.round:hover,#bar .btn.round.on{background:#3b1fa3}
  body:not(.political) .label.country{display:none}
  .label.country{background:transparent;border:0;box-shadow:none;color:#fff;font-size:15px;letter-spacing:1.5px;text-transform:uppercase;text-shadow:0 1px 0 #2a1450,0 0 6px #2a1450,0 0 2px #2a1450;pointer-events:none!important}
  #ageMsg{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);font-size:22px;padding:14px 26px;border-radius:999px;background:var(--card);border:2px solid var(--edge);opacity:0;transition:opacity .3s;pointer-events:none;z-index:30}
  #ageMsg.on{opacity:1}
  #updBtn{position:fixed;right:14px;bottom:14px;z-index:21}
  .btn.round.on{background:#ffffff33;border-color:#fff}
  .btn.round.checking svg{animation:updspin .9s linear infinite}
  .btn.round.avail{border-color:var(--accent);color:var(--accent);animation:updjiggle 2.6s ease-in-out infinite}
  @keyframes updspin{to{transform:rotate(360deg)}}
  @keyframes updjiggle{0%,45%,100%{transform:rotate(0)}8%{transform:rotate(-13deg)}16%{transform:rotate(11deg)}24%{transform:rotate(-8deg)}32%{transform:rotate(5deg)}40%{transform:rotate(-2deg)}}
  #updMsg{position:fixed;right:60px;bottom:19px;z-index:21;font-size:13px;padding:4px 12px;border-radius:999px;background:var(--card);border:2px solid var(--edge);opacity:0;transition:opacity .3s;pointer-events:none}
  #updMsg.on{opacity:1}
  #places{position:fixed;right:14px;top:calc(env(safe-area-inset-top,0px) + 62px);width:210px;max-height:calc(100% - 170px);overflow:auto;
    background:var(--card);border:2px solid var(--edge);border-radius:16px;padding:8px;display:none}
  #places.on{display:block}
  #places button{display:block;width:100%;text-align:left;font:inherit;font-size:14px;color:var(--txt);
    background:none;border:0;border-radius:10px;padding:7px 10px;cursor:pointer}
  #places button:hover{background:#3b1fa3}
  #places .sec{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);padding:6px 10px 2px}
  #loading{touch-action:none;position:fixed;inset:0;display:grid;place-items:center;background:#000005;font-size:22px;z-index:9;transition:opacity .6s}
  body.pointer canvas#c{cursor:pointer}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title"><h1>Nathaniel Planet</h1><p>Anton's vision of another world</p></div>
<div id="bar">
  <button class="btn round" id="ageBtn" aria-label="Travel in time" title="Travel in time"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2h12M6 22h12"/><path d="M7 2c0 6 10 6 10 10S7 16 7 22"/><path d="M17 2c0 6-10 6-10 10s10 4 10 10"/></svg></button>
  <button class="btn round" id="polBtn" aria-label="Show countries" title="Show countries"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V3"/><path d="M5 4h11l-2 4 2 4H5"/></svg></button>
  <button class="btn round" id="cityBtn" aria-label="Cities" title="Cities"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21V12l4-3 4 3v9"/><path d="M11 21V8h5v13"/><path d="M16 21v-7h5v7"/><path d="M13.5 8V3.5l3 1.2-3 1.2"/><path d="M2 21h20"/></svg></button>
  <button class="btn round" id="wonderBtn" aria-label="Wonders" title="Wonders"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21l6.5-12h5L21 21z"/><path d="M12 6V2.5M8.5 5L6.5 2.5M15.5 5l2-2.5"/></svg></button>
</div>
<button class="btn round" id="updBtn" aria-label="Check for updates" title="Check for updates"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg></button>
  <div id="updMsg"></div>
<div id="places"></div>
<div id="card"><button id="cardX" aria-label="close">×</button><canvas id="cardPic" width="112" height="112"></canvas><div id="cardTxt"><h2></h2><div id="cardBody"></div></div></div>
<div id="ageMsg"></div>
<button id="alienBtn" aria-label="Alien invasion" title="Alien invasion"><svg viewBox="0 0 60 54"><path d="M30 3 L57 50 H3 Z" fill="#e01b1b" stroke="#fff" stroke-width="4" stroke-linejoin="round"/><path d="M30 12 L50 46 H10 Z" fill="#ffd400"/><ellipse cx="30" cy="34" rx="8" ry="9" fill="#3fa82f"/><ellipse cx="30" cy="31" rx="4.5" ry="4" fill="#fff"/><circle cx="30" cy="31" r="2" fill="#111"/><path d="M24 40 q-3 5 -6 4 M36 40 q3 5 6 4 M30 42 v5" stroke="#3fa82f" stroke-width="2" fill="none" stroke-linecap="round"/></svg><span>Alien invasion</span></button>
<div id="loading">Making a planet…</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="planet-gen.js"></script>
<script src="city-gen.js"></script>
<script src="invasion.js"></script>
<script>
(function () {
'use strict';
const T = THREE;
const SEED = 101;

/* ---------- content ---------- */
const CITY_INFO = [
  ['Nate Zealand', 'Famous for sheep that knit their own sweaters.'],
  ['Noranta', 'Its streets get repainted a different colour every Tuesday.'],
  ['Nephatal', 'Home of the tallest sandcastle in the world. It has stood for 400 years.'],
  ['Nimbleton', 'Everyone here walks on tiptoe, just in case.'],
  ['Snorfen', 'A very sleepy town. The mayor naps through every speech.'],
  ['Gnarlyburg', 'Built inside one enormous, twisty tree.'],
  ['Tanglenook', 'Nobody has ever found the way out. Nobody minds.'],
  ['Quonkle', 'Population: 12 people and 4,000 frogs.'],
  ['Nubbin Bay', 'The seagulls here play the bagpipes. Badly, and proudly.'],
  ['Wibblenon', 'A wobbly city that sways gently in the breeze.'],
  ['Fizzlewick', 'Everything here is fizzy, even the rivers. Residents burp politely hello.'],
  ['Pudding Rock', 'A mountain made of pudding, repaired every spring with custard.'],
  ['Mumblesby', 'Nobody has understood the mayor since 1904. He is re-elected every year.'],
  ['Toastwick', 'Heated by one enormous toaster. It smells wonderful all day.'],
  ['Hiccup Harbour', 'Every boat that docks gives a little hiccup. It is considered good luck.'],
  ['Spindlewood', 'The houses stand on stilts, and the stilts stand on smaller stilts.'],
  ['Bumblepuff', 'A town made of cloud that landed by mistake and decided to stay.'],
  ['Ottermere', 'Run entirely by otters. The mayor is permanently damp.'],
  ['Crumpet Cove', 'Has more crumpets than people. The exact ratio is disputed.'],
  ['Zigzagton', 'No road here goes straight. The postman is extremely fit.'],
];

/* ---------- renderer / scene ---------- */
const canvas = document.getElementById('c');
const renderer = new T.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0x000005);
const scene = new T.Scene();
const camera = new T.PerspectiveCamera(42, 1, 0.004, 400);
camera.position.set(0.9, 0.7, 3.3);
scene.add(camera);

const sun = new T.DirectionalLight(0xffffff, 0.62);
sun.position.set(-2, 2.2, 3);
camera.add(sun);
scene.add(new T.AmbientLight(0xffffff, 0.66));

const controls = new T.OrbitControls(camera, canvas);
controls.enablePan = false;
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.minDistance = 1.06;
controls.maxDistance = 6;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.24;
let lastTouch = performance.now();                       // the planet only starts spinning after 30 s without any interaction
for (const eventName of ['pointerdown', 'pointermove', 'wheel', 'touchstart', 'keydown']) {
  addEventListener(eventName, event => {
    if (eventName !== 'pointermove' || event.buttons) lastTouch = performance.now();   // moving the mouse only counts while a button is held
  }, { passive: true });
}

const planetGroup = new T.Group();   // everything that sits on the planet goes in here
scene.add(planetGroup);

// The "cartoon shading" ramp: five flat brightness steps instead of a smooth gradient.
const toonGrad = (() => {
  const steps = new Uint8Array([95, 140, 185, 225, 255]);
  const texture = new T.DataTexture(steps, 5, 1, T.LuminanceFormat);
  texture.minFilter = texture.magFilter = T.NearestFilter;
  texture.needsUpdate = true;
  return texture;
})();
// A cartoon-shaded material in the given colour. `extra` adds or overrides material options.
const toon = (color, extra) => new T.MeshToonMaterial(Object.assign({ color, gradientMap: toonGrad }, extra || {}));
// The black material used for the cartoon outlines (a slightly bigger copy of a mesh, drawn inside out behind it).
const inkMat = new T.MeshBasicMaterial({ color: 0x120a2a, side: T.BackSide });
// Gives `mesh` a black outline, `scale` times its size (default 1.12). Returns the mesh.
function withInk(mesh, scale) {
  const outline = new T.Mesh(mesh.geometry, inkMat);
  outline.scale.setScalar(scale || 1.12);
  mesh.add(outline);
  return mesh;
}

const UP = new T.Vector3(0, 1, 0);
// Stands `object` on the planet's surface at direction `normal` (a unit vector), `radius` from the centre
// (default 1), pointing away from the planet and turned by `spin` radians about its own upright axis.
function placeOnSurface(object, normal, radius, spin) {
  object.position.copy(normal).multiplyScalar(radius || 1);
  object.quaternion.setFromUnitVectors(UP, normal);
  if (spin) object.rotateY(spin);
}
const v3 = xyz => new T.Vector3(xyz[0], xyz[1], xyz[2]);                              // [x, y, z] array -> Vector3
const angle = (a, b) => Math.acos(Math.min(1, Math.max(-1, a.dot(b))));              // angle in radians between two unit vectors

/* ---------- stars ---------- */
let starMat = null;   // the stars' material; its `time` uniform is updated every frame to make them twinkle
(function () {
  const starCount = 6000;
  const positions = new Float32Array(starCount * 3), colors = new Float32Array(starCount * 3);
  const sizes = new Float32Array(starCount), twinklePhases = new Float32Array(starCount);
  const rng = PlanetGen.mulberry32(5);
  const tints = [[1, 1, 1], [1, .93, .75], [.75, .85, 1], [1, .8, .85]];   // white, yellow, blue, pink
  // The milky way is a band of stars round the sky: bandNormal is the axis of the band, bandAxisA/B lie along it.
  const bandNormal = new T.Vector3(0.42, 0.88, 0.2).normalize();
  const bandAxisA = new T.Vector3().crossVectors(bandNormal, new T.Vector3(0, 0, 1)).normalize();
  const bandAxisB = new T.Vector3().crossVectors(bandNormal, bandAxisA);
  const gauss = () => (rng() + rng() + rng() + rng() - 2) / 2;      // roughly bell-shaped random number, about -1..1
  for (let i = 0; i < starCount; i++) {
    const skyRadius = 120;
    let x, y, z;
    if (i < starCount * 0.38) {                  // a crowd of fainter stars along the milky way
      const angleAlongBand = rng() * 6.2832, offsetFromBand = gauss() * 0.3;
      const direction = new T.Vector3()
        .addScaledVector(bandAxisA, Math.cos(angleAlongBand))
        .addScaledVector(bandAxisB, Math.sin(angleAlongBand))
        .addScaledVector(bandNormal, offsetFromBand)
        .normalize();
      x = direction.x; y = direction.y; z = direction.z;
    } else {                                     // the rest are scattered evenly over the whole sky
      z = rng() * 2 - 1;
      const longitude = rng() * 6.2832, ringRadius = Math.sqrt(1 - z * z);
      x = ringRadius * Math.cos(longitude); y = z; z = ringRadius * Math.sin(longitude);
    }
    positions.set([skyRadius * x, skyRadius * y, skyRadius * z], i * 3);
    colors.set(tints[Math.floor(rng() * tints.length)], i * 3);
    sizes[i] = rng() < 0.06 ? 6 + rng() * 5 : (i < starCount * 0.38 ? 1.4 + rng() * 1.8 : 1.8 + rng() * 2.6);   // a few big bright stars
    twinklePhases[i] = rng() * 6.28;
  }
  const geometry = new T.BufferGeometry();
  geometry.setAttribute('position', new T.BufferAttribute(positions, 3));
  geometry.setAttribute('color', new T.BufferAttribute(colors, 3));
  geometry.setAttribute('size', new T.BufferAttribute(sizes, 1));
  geometry.setAttribute('phase', new T.BufferAttribute(twinklePhases, 1));
  // Each star is a soft round dot whose brightness wobbles over time (vT), offset by its own phase.
  const material = new T.ShaderMaterial({
    uniforms: { time: { value: 0 }, pr: { value: renderer.getPixelRatio() } },
    vertexShader: `attribute float size; attribute float phase; attribute vec3 color; uniform float time; uniform float pr;
      varying vec3 vC; varying float vT;
      void main(){ vC=color; vT=0.65+0.35*sin(time*1.4+phase);
        gl_PointSize=size*pr*(0.8+0.2*vT); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);} `,
    fragmentShader: `varying vec3 vC; varying float vT;
      void main(){ float d=length(gl_PointCoord-0.5); float a=smoothstep(0.5,0.1,d)*vT; gl_FragColor=vec4(vC,a);} `,
    transparent: true, depthWrite: false,
  });
  const points = new T.Points(geometry, material);
  points.frustumCulled = false;
  scene.add(points);
  starMat = material;
})();


/* ---------- build the world (after first paint) ---------- */
let world = null;
const pickables = [];   // things you can click or tap on the planet
const labels = [];      // the floating name labels
const tickers = [];     // functions(t, dt) that are called every frame
// The globe is now 1.5x wider again (radius x 2.12 in total). The scene is kept in unit-sphere
// coordinates, so every object on it is shrunk by K: cities, ships etc. stay the size they were.
const GROW = 1.25;                          // globe area x1.5625 on top of the 1.5x-wide planet (two +25% steps)
const RK = 1 / GROW;                           // size factor for things not scaled by K (track, town squares)
const K = Math.SQRT1_2 / 1.5 * RK;

/* merge many small static meshes into two draw calls (coloured + ink outline) */
// parts: [[geometry, THREE.Color], ...]. Returns one vertex-coloured, non-indexed geometry containing them all.
function mergeParts(parts) {
  // First make every geometry non-indexed and count the total vertices.
  let totalVertices = 0;
  const flatParts = parts.map(([geometry, color]) => {
    const flat = geometry.index ? geometry.toNonIndexed() : geometry;
    totalVertices += flat.attributes.position.count;
    return [flat, color];
  });
  const positions = new Float32Array(totalVertices * 3), normals = new Float32Array(totalVertices * 3), colors = new Float32Array(totalVertices * 3);
  let vertexOffset = 0;
  for (const [geometry, color] of flatParts) {
    const vertexCount = geometry.attributes.position.count;
    positions.set(geometry.attributes.position.array, vertexOffset * 3);
    normals.set(geometry.attributes.normal.array, vertexOffset * 3);
    for (let i = 0; i < vertexCount; i++) {                    // paint every vertex of this part in its colour
      colors[(vertexOffset + i) * 3] = color.r;
      colors[(vertexOffset + i) * 3 + 1] = color.g;
      colors[(vertexOffset + i) * 3 + 2] = color.b;
    }
    vertexOffset += vertexCount;
  }
  const merged = new T.BufferGeometry();
  merged.setAttribute('position', new T.BufferAttribute(positions, 3));
  merged.setAttribute('normal', new T.BufferAttribute(normals, 3));
  merged.setAttribute('color', new T.BufferAttribute(colors, 3));
  return merged;
}
/* Collects the meshes of several objects and bakes them into just two meshes (coloured + outline).
   Use: const baker = makeBaker(); baker.add(object); ...; baker.finish(parentObject). */
function makeBaker() {
  const colouredParts = [], inkParts = [];
  return {
    // Adds every mesh under `root`, frozen in its current world position.
    add(root) {
      root.updateMatrixWorld(true);
      root.traverse(object => {
        if (!object.isMesh) return;
        const geometry = object.geometry.clone();
        geometry.applyMatrix4(object.matrixWorld);
        if (!geometry.attributes.normal) geometry.computeVertexNormals();
        if (object.material === inkMat) inkParts.push([geometry, new T.Color(0)]);
        else colouredParts.push([geometry, object.material.color]);
      });
    },
    // Creates the two merged meshes and puts them in `parent`.
    finish(parent) {
      if (colouredParts.length) parent.add(new T.Mesh(mergeParts(colouredParts), toon(0xffffff, { vertexColors: true })));
      if (inkParts.length) parent.add(new T.Mesh(mergeParts(inkParts), inkMat));
    },
  };
}
/* a bumpy, craggy cone: radius, height, sides, height segments, how rough (jitter), and a seed so each one is different */
function craggyCone(radius, height, radialSegments, heightSegments, jitter, seed) {
  const geometry = new T.ConeGeometry(radius, height, radialSegments, heightSegments, false);
  geometry.translate(0, height / 2, 0);
  const positions = geometry.attributes.position;
  for (let i = 0; i < positions.count; i++) {
    const x = positions.getX(i), y = positions.getY(i), z = positions.getZ(i);
    const heightFraction = y / height;                      // 0 base .. 1 tip
    if (heightFraction > 0.97) continue;                    // leave the very tip pointy
    // A repeatable pseudo-random number from the vertex position, -0.5 .. 0.5
    const hashed = Math.sin((Math.round(x * 4000) * 12.9898 + Math.round(z * 4000) * 78.233 + Math.round(y * 4000) * 37.719 + seed) * 43758.5453);
    const randomOffset = (hashed - Math.floor(hashed)) - 0.5;
    const sideways = 1 + randomOffset * jitter * (1 - heightFraction * 0.4);   // push the vertex in or out
    positions.setXYZ(i, x * sideways, y + randomOffset * jitter * height * 0.07 * (heightFraction > 0.02 ? 1 : 0), z * sideways);
  }
  geometry.computeVertexNormals();
  return geometry;
}

/* Builds the whole world: sky, planet, places (cities, volcanoes, storms...), vehicles, wildlife and the user

      // minimum spanning tree over true route costs (Prim): connect every city to the network by its cheapest link

          if (used.has(j)) continue;

      const positions = [], normals = [], colors = [], tmpColor = new T.Color();

        for (const corner of [a, b, c, a, c, d]) {

          colors.push(tmpColor.r, tmpColor.g, tmpColor.b);

      // A point at height `r` above the planet's centre, `w` (scaled by RK) to the side of `n` along direction `s`.

        const pts = edge.pts;

        const sideways = pts.map((p, i) => {
          const before = pts[Math.max(0, i - 1)], after = pts[Math.min(pts.length - 1, i + 1)];

          tangent.addScaledVector(p, -tangent.dot(p)).normalize();
          return new T.Vector3().crossVectors(p, tangent).normalize();

        const ribbon = (r, offset, w, color) => {
          for (let i = 0; i < pts.length - 1; i++) {
            const a = pts[i], b = pts[i + 1], sideA = sideways[i], sideB = sideways[i + 1];

          }
        };

        ribbon(1.0013, 0, 0.0060, 0xcdb48f);          // gravel bed
        ribbon(1.0021, -0.0030, 0.0009, 0x4d5361);    // rails

  // Is direction `n` within angle `thr` of any railway track?

    return false;
  };

  /* ---------- countries: about eight on the big landmasses, and every decent island its own state ---------- */
  // Each country: { name, col: [r,g,b], seed: grid cell it grows from, comp: landmass number, island?, n: label position }
  const countries = [];
  {
    const countryOfCell = new Int16Array(GN).fill(-1);        // which country each cell ends up in
    const landmassOfCell = new Int32Array(GN).fill(-1);        // which landmass each (non-ice) land cell is on
    const landmassAreas = [], landmassCells = [];
    // Find every landmass by flood fill, with its area and its list of cells.

      if (!gLand[start] || gIce[start] || landmassOfCell[start] >= 0) continue;
      const landmassId = landmassAreas.length, stack = [start], cellList = [];
      let area = 0;
      landmassOfCell[start] = landmassId;
      while (stack.length) {
        const cell = stack.pop();
        cellList.push(cell);
        area += Math.sqrt(1 - gDir[cell * 3 + 1] ** 2);

      }
      landmassAreas.push(area);
      landmassCells.push(cellList);

    const totalArea = landmassAreas.reduce((sum, area) => sum + area, 0);
    const bySize = landmassAreas.map((area, i) => i).sort((a, b) => landmassAreas[b] - landmassAreas[a]);   // landmass numbers, biggest first
    const mainland = bySize.filter(i => landmassAreas[i] > totalArea * 0.05);                                // big landmasses
    const islands = bySize.filter(i => landmassAreas[i] <= totalArea * 0.05 && landmassAreas[i] > totalArea * 0.0025).slice(0, 10);   // decent-sized islands (at most 10)
    const mainlandArea = mainland.reduce((sum, i) => sum + landmassAreas[i], 0);

    const ISLAND_NAMES = ['Isle of Bap', 'Puddle Isles', 'Free State of Splosh', 'Little Plonk', 'Sploot', 'Isle of Wibble', 'Biscuit Rock', 'Paddle Isle', 'Dinkum', 'Mooch'];

    const seeds = [];

  /* mountains: craggy, merged into two draw calls */
  const mtnN = [];                                          // directions of the mountain groups placed (also used to keep other things clear of them)

  const rockColors = [0x9a8c9e, 0x8a7f96, 0xa59a8a, 0x8f8499];

  /* ---------- towns: each with its own personality (see city-gen.js), rebuilt for each age ---------- */
  const TOWN_S = 0.025 * K;                       // world size of one town unit (one small house)

  planetGroup.add(townGroup);
  // Spots that modern cities must not spread over: the three special volcanoes and every mountain group, each with a radius.
  const avoidN = [fugi.n, fug2.n, nug.n].map((n, i) => [n, [0.075, 0.03, 0.045][i]]).concat(mtnN.map(n => [n, 0.022]));
  const townPrep = [];   // everything needed to (re)build each town, kept so towns can be rebuilt for each age
  {
    const styleOrder = ['walled', 'castle', 'cathedral', 'market', 'windmills', 'factory', 'walled', 'castle', 'cathedral', 'market', 'factory', 'windmills'];
    let styleIndex = 0;
    cities.forEach((city, idx) => {
      const n = city.n;

      const east = new T.Vector3().crossVectors(n, Math.abs(n.y) > 0.95 ? new T.Vector3(1, 0, 0) : UP).normalize();

      const land = (x, z) => {

      const landClear = (x, z) => {

        return true;
      };
      // Which way is the sea? (angle of the first non-land spot found round the town, or null if the town is inland)
      let seaDir = null;
      for (let k = 0; k < 24 && seaDir === null; k++) {
        for (const radius of [city.Ru * 0.9, city.Ru * 1.3]) {
          const seaAngle = k / 24 * 6.28;
          if (!land(Math.sin(seaAngle) * radius, Math.cos(seaAngle) * radius)) { seaDir = seaAngle; break; }
        }
      }

  else if (kind === 'volcano') { n = c.n; dist = 1.6; c.erupt(); showCard(c.name, VOLCANO_LINES[world.volcanoes.indexOf(c)][lineI++ % 3]); }
  else if (kind === 'storm') { n = c.n; dist = 2.0; c.zap(); showCard(c.name, c.lines[c.li++ % c.lines.length]); }
  else if (kind === 'station') { n = c.n; dist = 2.3; showCard(c.name, c.lines[c.li++ % c.lines.length]); }
  else if (kind === 'launch') { const ok = c.go && c.go(); n = c.rocketN || c.n; dist = ok ? 1.45 : 1.3; showCard(c.name, ok ? '3… 2… 1… Lift-off! A brand new satellite is on its way to orbit.' : c.state === 'ready' ? 'The launch pad is waiting.' : 'Hold on, a rocket is already on its way!'); }

  else if (kind === 'glacier') { n = c.n; dist = 1.55; showCard(c.name, GLACIER_LINES, drawGlacierCloseup); }

/* ---------- focus: a tapped thing is centred and stays centred (moving things are followed) ---------- */
let focus = null;
function setFocus(n, dist) { focus = { n, dist: Math.min(Math.max(dist, controls.minDistance), controls.maxDistance), ease: 1.6 }; cardCloseAt = closeDistFor(focus.dist); }
function releaseFocus() { focus = null; }          // spin (if switched on) starts again
const _fc = new T.Vector3();
function stepFocus(dt) {
  if (!focus || down) return;
  const dist = camera.position.length();
  if (focus.ease <= 0 && dist > 2.6) { releaseFocus(); if (world) world.clearBoat(true); return; }   // zoomed out: user has moved on
  _fc.copy(camera.position).normalize();
  const a = 1 - Math.exp(-dt * 3.5), ang = Math.acos(Math.min(1, _fc.dot(focus.n)));
  if (ang > 1e-4) { const sn = Math.sin(ang); _fc.multiplyScalar(Math.sin((1 - a) * ang) / sn).addScaledVector(focus.n, Math.sin(a * ang) / sn); }

}

/* ---------- input ---------- */
const ray = new T.Raycaster(), mouse = new T.Vector2();
let down = null;
function pick(ev) {
  const r = canvas.getBoundingClientRect();
  mouse.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  camera.matrixWorld.copy(tiltedMat); ray.setFromCamera(mouse, camera);

  // strip hits hidden behind the planet itself
  for (const h of hits) { const u = h.object.userData; if (u.off) continue; let o = h.object, vis = true; while (o) { if (!o.visible) { vis = false; break; } o = o.parent; } if (!vis) continue; if (u.kind === 'planet') return null; return u; }

}
canvas.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY }; });
canvas.addEventListener('pointerup', e => {
  if (!down || !world) return;
  const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y); down = null;
  if (moved > 6) return;

/* ---------- loop ---------- */
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  if (w / h < 0.9) camera.fov = 58; else camera.fov = 42; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

let last = performance.now(), time = 0;
/* view tilt: the camera orbits the planet looking straight down at whatever is in the middle. Zoom in and it eases
   round that middle point to an angled view (about 34 degrees off straight-down); zoom out and it returns to straight down.
   Controls keep working on the untilted ("base") pose. */
const baseCam = new T.Vector3(), baseQuat = new T.Quaternion(), tiltedMat = new T.Matrix4(), viewDir = new T.Vector3(0, 0, 1);
let tiltCur = 0, baseDist = 3;
const TILT = 0.6, ZOOM_FULL = 1.55, ZOOM_NONE = 2.5;
const _tq = new T.Quaternion(), _tr = new T.Vector3(), _to = new T.Vector3();
function applyTilt() {
  baseDist = baseCam.length(); viewDir.copy(baseCam).normalize();
  const t = Math.min(1, Math.max(0, (baseDist - ZOOM_FULL) / (ZOOM_NONE - ZOOM_FULL)));
  tiltCur = TILT * (1 - t * t * (3 - 2 * t));

    _tq.setFromAxisAngle(_tr, tiltCur);

}

  { const dd = camera.position.length(); controls.rotateSpeed = Math.max(0.03, 0.25 + (dd - 1.5) * 0.18) * Math.min(1, (dd - 1) / 0.45); controls.zoomSpeed = Math.max(0.06, 1.2 * (dd - 1) / dd); }

<script>
/* ---------- update checker: looks every 10 minutes, jiggles the button when a new version is out ---------- */
(() => {
  const FILES = ['index.html', 'planet-gen.js', 'planet-worker.js', 'planet-tile.js', 'planet-tile-worker.js', 'city-gen.js', 'invasion.js', 'manifest.webmanifest'];
  const btn = document.getElementById('updBtn'), msg = document.getElementById('updMsg');
  let base = null, avail = false, busy = false, lastCheck = 0, msgT = 0;
  const hash = t => { let h = 2166136261; for (let i = 0; i < t.length; i++) { h ^= t.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36) + '.' + t.length; };
  const sig = async fresh => (await Promise.all(FILES.map(async f => {
    const r = await fetch(f, fresh ? { cache: 'no-store' } : undefined); if (!r.ok) throw new Error(f); return hash(await r.text());
  }))).join('|');
  const say = t => { msg.textContent = t; msg.classList.add('on'); clearTimeout(msgT); msgT = setTimeout(() => msg.classList.remove('on'), 2600); };
  const setAvail = v => { avail = v; btn.classList.toggle('avail', v); btn.title = v ? 'Update available: tap to update' : 'Check for updates'; };
  async function check(manual) {
    if (busy) return; busy = true; btn.classList.add('checking'); lastCheck = Date.now();
    try {
      if (base === null) base = await sig(false);          // what this page was loaded with
      const now = await sig(true);                          // what the server has right now
      if (now !== base) { setAvail(true); if (manual) { say('Updating…'); await apply(); return; } }
      else if (manual) say('Up to date ✓');
    } catch (e) { if (manual) say(navigator.onLine ? 'Couldn\'t check' : 'Offline'); }
    busy = false; btn.classList.remove('checking');
  }
  async function apply() {
    try {
      await Promise.all(FILES.map(f => fetch(f, { cache: 'reload' })));            // refresh the browser's own copies
      if (window.caches) for (const k of await caches.keys()) await caches.delete(k);
      if (navigator.serviceWorker) { const reg = await navigator.serviceWorker.getRegistration(); if (reg) await reg.update(); }
    } catch (e) {}
    location.reload();
  }
  btn.onclick = () => { if (avail) { busy = true; btn.classList.add('checking'); say('Updating…'); apply(); } else check(true); };
  addEventListener('load', () => setTimeout(() => { if (base === null) sig(false).then(b => { if (base === null) base = b; }).catch(() => {}); }, 1500));
  setInterval(() => check(false), 10 * 60 * 1000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && Date.now() - lastCheck > 60000) check(false); });
})();
</script>
